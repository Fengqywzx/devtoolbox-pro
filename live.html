<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📊 镜观文案 · 运行看板</title>
<style>
:root{--bg:#08080f;--card:#111122;--border:#1a1a38;--text:#d0d0e0;--accent:#6c5ce7;--green:#00e676;--red:#ff5252;--orange:#ffab40;--blue:#448aff;--muted:#666688}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",monospace;padding:16px;min-height:100vh}
h1{font-size:1.2rem;text-align:center;padding:12px 0;color:var(--accent)}
h1 .dot{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);font-size:.8rem;font-weight:700}
.status-badge{padding:3px 10px;border-radius:12px;font-size:.65rem;font-weight:600}
.status-badge.on{background:#0a2a0a;color:var(--green)}
.status-badge.warn{background:#2a1a0a;color:var(--orange)}
.status-badge.off{background:#2a0a0a;color:var(--red)}
.stat-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.75rem}
.stat-val{font-weight:700}
.stat-val.g{color:var(--green)}.stat-val.b{color:var(--blue)}.stat-val.o{color:var(--orange)}.stat-val.r{color:var(--red)}
.big-num{font-size:2.2rem;font-weight:900;text-align:center}
.big-label{text-align:center;font-size:.7rem;color:var(--muted)}
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-go{background:var(--green);color:#000}
.btn-accent{background:var(--accent);color:#fff}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.link-card{display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(255,255,255,0.02);border-radius:10px;text-decoration:none;color:var(--text);border:1px solid transparent;transition:all .2s;margin-bottom:8px}
.link-card:hover{border-color:var(--accent);background:rgba(108,92,231,0.06)}
.link-card .icon{font-size:1.5rem}
.link-card .title{font-weight:600;font-size:.9rem}
.link-card .desc{font-size:.7rem;color:var(--muted);margin-top:2px}
.works-table{width:100%;border-collapse:collapse;font-size:.7rem}
.works-table th{text-align:left;padding:6px 8px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)}
.works-table td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.03)}
.works-table tr:hover td{background:rgba(255,255,255,0.02)}
.type-chips{display:flex;flex-wrap:wrap;gap:6px}
.type-chip{padding:4px 12px;border-radius:12px;font-size:.7rem;font-weight:600}
</style>
</head>
<body>

<h1>📊 镜观文案 · 运营看板 <span class="dot" id="statusDot">●</span></h1>

<div class="grid">
  <!-- Static portfolio stats (always available) -->
  <div class="card">
    <div class="card-header"><span>🎨 作品统计</span><span class="status-badge on" id="modeBadge">静态数据</span></div>
    <div class="big-num g" id="wsTotal">-</div>
    <div class="big-label">作品总数</div>
    <div class="stat-row" style="margin-top:12px"><span>推荐作品</span><span class="stat-val g" id="wsTop">-</span></div>
    <div class="stat-row"><span>总字数</span><span class="stat-val b" id="wsWords">-</span></div>
    <div class="stat-row"><span>最高评分</span><span class="stat-val o" id="wsMaxScore">-</span></div>
    <div class="stat-row"><span>文案类型</span><span class="stat-val" id="wsTypes">-</span></div>
  </div>

  <!-- Type distribution -->
  <div class="card">
    <div class="card-header"><span>📊 类型分布</span></div>
    <div id="typeDistrib"><div style="color:var(--muted);text-align:center;padding:20px;">加载中...</div></div>
  </div>

  <!-- Quick links -->
  <div class="card">
    <div class="card-header"><span>🔗 快速跳转</span></div>
    <a class="link-card" href="index.html"><span class="icon">🏠</span><div><div class="title">主站首页</div><div class="desc">镜观作品集门户</div></div></a>
    <a class="link-card" href="portfolio.html"><span class="icon">🎨</span><div><div class="title">作品全集</div><div class="desc">322篇文案 · 全文浏览</div></div></a>
    <a class="link-card" href="novel.html"><span class="icon">📖</span><div><div class="title">小说连载</div><div class="desc">《万象——世界奇迹日志》</div></div></a>
    <a class="link-card" href="admin.html"><span class="icon">🧬</span><div><div class="title">管理面板</div><div class="desc">系统监控 · 数据看板</div></div></a>
    <div style="margin-top:10px;padding:10px;background:rgba(255,255,255,0.02);border-radius:8px;font-size:.7rem;color:var(--muted);line-height:1.6;">
      💡 如需实时运行面板（端口3457）：<br>
      <code style="color:var(--green);">http://localhost:3457</code>
    </div>
  </div>

  <!-- Recent top works -->
  <div class="card" style="grid-column:span 2">
    <div class="card-header"><span>🏆 高分作品 TOP 10</span><span id="topWorksCount"></span></div>
    <div id="topWorks" style="max-height:280px;overflow-y:auto;"><div style="color:var(--muted);text-align:center;padding:20px;">加载中...</div></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  DUAL MODE: Static JSON / Live Server (port 3457)
// ═══════════════════════════════════════════

var MODE = 'static';

function loadStatic() {
  fetch('./portfolio-data.json').then(function(r){return r.json();}).then(function(works){
    if (!works || !works.length) { document.getElementById('wsTotal').textContent = '0'; return; }

    document.getElementById('wsTotal').textContent = works.length;
    var top = works.filter(function(w){ return w.isTop || w.grade === 'A'; }).length;
    document.getElementById('wsTop').textContent = top;
    var totalWords = works.reduce(function(s,w){ return s + (w.word_count || 0); }, 0);
    document.getElementById('wsWords').textContent = (totalWords/10000).toFixed(1) + '万';
    var maxScore = works.reduce(function(m,w){ return Math.max(m, w.score||0); }, 0);
    document.getElementById('wsMaxScore').textContent = maxScore + '分';
    var types = {};
    works.forEach(function(w){ var t = w.type || '其他'; types[t] = (types[t]||0) + 1; });
    document.getElementById('wsTypes').textContent = Object.keys(types).length + '种';

    // Type distribution
    var typeHtml = '';
    var sorted = Object.keys(types).sort(function(a,b){ return types[b]-types[a]; });
    var maxVal = Math.max.apply(null, Object.values(types));
    var colors = ['#00e676','#448aff','#6c5ce7','#ffab40','#ff5252','#00bcd4'];
    sorted.forEach(function(t,i){
      var pct = (types[t]/maxVal*100).toFixed(0);
      var c = colors[i % colors.length];
      typeHtml += '<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:.7rem;margin-bottom:2px;"><span>' + t + '</span><span style="color:' + c + ';font-weight:700;">' + types[t] + '篇</span></div><div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden;"><div style="height:100%;width:' + pct + '%;background:' + c + ';border-radius:3px;transition:width .5s;"></div></div></div>';
    });
    document.getElementById('typeDistrib').innerHTML = typeHtml;

    // Top 10 works
    var sorted = works.slice().sort(function(a,b){ return (b.score||0) - (a.score||0); }).slice(0, 10);
    document.getElementById('topWorksCount').textContent = '(' + sorted.length + '篇)';
    var th = '<table class="works-table"><thead><tr><th>#</th><th>标题</th><th>类型</th><th>评分</th><th>字数</th></tr></thead><tbody>';
    sorted.forEach(function(w,i){
      var gradeC = w.score >= 90 ? 'g' : w.score >= 80 ? 'o' : '';
      var shortTitle = (w.title||'?').length > 20 ? (w.title||'?').slice(0,20)+'…' : (w.title||'?');
      th += '<tr><td>' + (i+1) + '</td><td>' + shortTitle + '</td><td>' + (w.type||'') + '</td><td class="stat-val ' + gradeC + '">' + (w.score||'-') + '</td><td>' + (w.word_count||'') + '</td></tr>';
    });
    th += '</tbody></table>';
    document.getElementById('topWorks').innerHTML = th;
  }).catch(function(){
    document.getElementById('wsTotal').textContent = '❌';
    document.getElementById('typeDistrib').innerHTML = '<div style="color:var(--red);text-align:center;padding:10px;">数据文件缺失</div>';
  });
}

// Try live server first
function tryServer() {
  fetch('http://localhost:3457/api/status', {signal: AbortSignal.timeout(2000)}).then(function(r){return r.json();}).then(function(s){
    MODE = 'live';
    document.getElementById('modeBadge').textContent = '实时模式';
    document.getElementById('modeBadge').className = 'status-badge on';
    document.getElementById('statusDot').style.color = 'var(--green)';
    document.getElementById('wsTotal').textContent = s.projectsFound || '-';
    document.getElementById('wsTop').textContent = '服务器在线';
    document.getElementById('wsWords').textContent = '端口3457';
    document.getElementById('wsMaxScore').textContent = (s.uptime ? Math.floor(s.uptime/60)+'分运行' : '-');
    document.getElementById('wsTypes').textContent = 'v'+(s.version||'10');
    document.getElementById('typeDistrib').innerHTML = '<div style="color:var(--green);text-align:center;padding:20px;">✅ 服务器在线<br><span style="font-size:.65rem;color:var(--muted);">完整看板请访问 http://localhost:3457</span></div>';
    document.getElementById('topWorks').innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px;">实时数据请在本地访问: http://localhost:3457</div>';
  }).catch(function(){
    MODE = 'static';
    document.getElementById('modeBadge').textContent = '静态模式';
    document.getElementById('statusDot').style.color = 'var(--orange)';
    loadStatic();
  });
}

tryServer();
</script>
</body>
</html>
