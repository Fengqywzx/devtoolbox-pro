<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🔴 文案作战中心 — 实时运行面板</title>
<style>
:root{--bg:#08080f;--card:#111122;--border:#1a1a38;--text:#d0d0e0;--accent:#6c5ce7;--green:#00e676;--red:#ff5252;--orange:#ffab40;--blue:#448aff;--muted:#666688}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",monospace;padding:16px;min-height:100vh}
h1{font-size:1.2rem;text-align:center;padding:12px 0;color:var(--accent)}
h1 .dot{color:var(--green);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);font-size:.8rem;font-weight:700}
.status-badge{padding:3px 10px;border-radius:12px;font-size:.65rem;font-weight:600}
.status-badge.on{background:#0a2a0a;color:var(--green)}
.status-badge.warn{background:#2a1a0a;color:var(--orange)}
.stat-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.75rem}
.stat-val{font-weight:700}
.stat-val.g{color:var(--green)}.stat-val.b{color:var(--blue)}.stat-val.o{color:var(--orange)}.stat-val.r{color:var(--red)}
.log-box{max-height:180px;overflow-y:auto;font-size:.7rem;font-family:monospace}
.log-line{padding:2px 0;color:var(--muted);border-left:2px solid transparent;padding-left:8px}
.log-line.active{border-left-color:var(--green);color:var(--text)}
.log-line.warn{border-left-color:var(--orange)}
.log-line.err{border-left-color:var(--red)}
.progress-bar{height:4px;background:var(--border);border-radius:2px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .5s}
.big-num{font-size:2.2rem;font-weight:900;text-align:center}
.big-label{text-align:center;font-size:.7rem;color:var(--muted)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn-go{background:var(--green);color:#000}
.btn-go:hover{box-shadow:0 0 20px rgba(0,230,118,.3)}
.btn-stop{background:var(--red);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.pipeline-animation{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:.65rem;margin:8px 0}
.pipe-step{padding:4px 10px;border-radius:6px;background:var(--border)}
.pipe-step.done{background:#0a2a0a;color:var(--green)}
.pipe-arrow{color:var(--muted)}
#liveOutput{max-height:250px;overflow-y:auto;font-size:.72rem;background:#050510;border-radius:8px;padding:12px;border:1px solid var(--border);white-space:pre-wrap;line-height:1.6}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<h1>🔴 文案作战中心 v10 <span class="dot">●</span> 自循环运行中</h1>

<div class="grid">
  <!-- 系统状态 -->
  <div class="card">
    <div class="card-header"><span>🖥️ 系统状态</span><span class="status-badge on" id="sysBadge">运行中</span></div>
    <div class="stat-row"><span>版本</span><span class="stat-val b" id="sysVersion">v10.0.0</span></div>
    <div class="stat-row"><span>运行时间</span><span class="stat-val" id="sysUptime">0s</span></div>
    <div class="stat-row"><span>内存</span><span class="stat-val" id="sysMem">0MB</span></div>
    <div class="stat-row"><span>本地模型</span><span class="stat-val b" id="sysModels">13</span></div>
    <div class="stat-row"><span>未读通知</span><span class="stat-val o" id="sysNotifs">0</span></div>
  </div>

  <!-- Pipeline -->
  <div class="card">
    <div class="card-header"><span>🔄 自动Pipeline</span><span class="status-badge on" id="plBadge">运行中</span></div>
    <div class="stat-row"><span>已处理项目</span><span class="stat-val g" id="plProcessed">0</span></div>
    <div class="stat-row"><span>已写文案</span><span class="stat-val b" id="plWritten">0</span></div>
    <div class="stat-row"><span>可交付</span><span class="stat-val g" id="plReady">0</span></div>
    <div class="stat-row"><span>错误</span><span class="stat-val r" id="plErrors">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="plProgress" style="width:0%"></div></div>
    <div class="btn-row">
      <button class="btn btn-go" onclick="runNow()">▶ 立即运行</button>
      <button class="btn btn-accent" onclick="demoProject()">🧪 演示项目</button>
    </div>
  </div>

  <!-- 最近活动 -->
  <div class="card">
    <div class="card-header"><span>📋 实时日志</span><span id="logCount">0条</span></div>
    <div class="log-box" id="logBox">
      <div class="log-line">等待活动...</div>
    </div>
  </div>

  <!-- AI输出预览 -->
  <div class="card" style="grid-column:span 2">
    <div class="card-header"><span>📝 最新产出预览</span><span id="outputTime"></span></div>
    <div id="liveOutput">点击"演示项目"查看AI写作结果...</div>
  </div>

  <!-- 数据看板 -->
  <div class="card">
    <div class="card-header"><span>💰 财务仪表</span></div>
    <div class="big-num g" id="finTotal">¥0</div>
    <div class="big-label">累计收入</div>
    <div class="stat-row" style="margin-top:12px"><span>已收款项目</span><span class="stat-val" id="finPaid">0</span></div>
    <div class="stat-row"><span>待收款</span><span class="stat-val o" id="finPending">0</span></div>
    <div class="stat-row"><span>均价</span><span class="stat-val b" id="finAvg">¥0</span></div>
  </div>

  <div class="card">
    <div class="card-header"><span>🎯 项目猎手</span></div>
    <div class="stat-row"><span>监控平台</span><span class="stat-val b">5个</span></div>
    <div class="stat-row"><span>已发现项目</span><span class="stat-val g" id="hunterFound">0</span></div>
    <div class="stat-row"><span>上次扫描</span><span class="stat-val" id="hunterLast">-</span></div>
    <div class="stat-row"><span>自动模式</span><span class="status-badge on">每5分钟</span></div>
  </div>

  <div class="card">
    <div class="card-header"><span>🧠 模块状态</span></div>
    <div class="stat-row"><span>V5 通知</span><span class="status-badge on">✅</span></div>
    <div class="stat-row"><span>V6 RAG检索</span><span class="status-badge on">✅</span></div>
    <div class="stat-row"><span>V7 分析引擎</span><span class="status-badge on">✅</span></div>
    <div class="stat-row"><span>V8 协作引擎</span><span class="status-badge on">✅</span></div>
    <div class="stat-row"><span>V9 自媒体</span><span class="status-badge on">✅</span></div>
    <div class="stat-row"><span>V10 市场</span><span class="status-badge on">✅</span></div>
  </div>
</div>

<script>
const API = 'http://localhost:3457/api';
let logLines = [];

function addLog(msg, type='active') {
  logLines.unshift({ msg, type, time: new Date().toLocaleTimeString() });
  if (logLines.length > 50) logLines.length = 50;
  document.getElementById('logBox').innerHTML = logLines.map(l =>
    `<div class="log-line ${l.type}">[${l.time}] ${l.msg}</div>`
  ).join('');
  document.getElementById('logCount').textContent = logLines.length + '条';
}

async function refresh() {
  try {
    const s = await fetch(API + '/status').then(r => r.json());
    document.getElementById('sysUptime').textContent = Math.floor(s.uptime/60) + '分' + Math.floor(s.uptime%60) + '秒';
    document.getElementById('sysMem').textContent = Math.round(s.memory.rss/1024/1024) + 'MB';
    document.getElementById('sysModels').textContent = s.localModels?.length || 0;
    document.getElementById('sysNotifs').textContent = s.notifications || 0;
    document.getElementById('sysVersion').textContent = s.version || 'v10';
    document.getElementById('hunterFound').textContent = s.projectsFound || 0;
    document.getElementById('sysBadge').textContent = s.online ? '运行中' : '异常';
  } catch { document.getElementById('sysBadge').textContent = '重连中...'; document.getElementById('sysBadge').className = 'status-badge warn'; }

  try {
    const pl = await fetch(API + '/pipeline/status').then(r => r.json());
    document.getElementById('plProcessed').textContent = pl.processed || 0;
    document.getElementById('plWritten').textContent = pl.written || 0;
    document.getElementById('plErrors').textContent = pl.errors || 0;
    document.getElementById('plProgress').style.width = Math.min(100, (pl.written||0)*20) + '%';
    if (pl.log?.length) addLog(pl.log[0].message, 'active');
  } catch {}

  try {
    const fin = await fetch(API + '/crm/finance').then(r => r.json());
    document.getElementById('finTotal').textContent = '¥' + (fin.totalIncome||0).toLocaleString();
    document.getElementById('finPaid').textContent = fin.paidProjects || 0;
    document.getElementById('finPending').textContent = fin.unpaidDelivered || 0;
    document.getElementById('finAvg').textContent = '¥' + (fin.averageOrderValue||0).toLocaleString();
  } catch {}
}

async function runNow() {
  addLog('🚀 手动触发全自动Pipeline...', 'active');
  document.getElementById('liveOutput').textContent = '⏳ Pipeline运行中...';
  try {
    const r = await fetch(API + '/pipeline/run', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({autoWrite:true,maxProjects:3}) }).then(r=>r.json());
    addLog(`✅ Pipeline完成: 处理${r.projects}个 | 写${r.written}篇 | 可交付${r.ready}篇`, 'active');
    document.getElementById('liveOutput').textContent = JSON.stringify(r, null, 2);
    document.getElementById('plReady').textContent = r.ready || 0;
  } catch(e) { addLog('❌ Pipeline失败: ' + e.message, 'err'); }
}

async function demoProject() {
  addLog('🧪 运行演示项目: 教育品牌故事...', 'active');
  document.getElementById('liveOutput').textContent = '⏳ AI正在写作 (约25秒)...';
  document.getElementById('outputTime').textContent = new Date().toLocaleTimeString();

  try {
    const r = await fetch(API + '/v4/full-pipeline', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ title:'需要一个12年教育机构的品牌故事，从地下室到全国30家分校', type:'brand_story', platform:'zbj', budget:1200, wordCount:1000, urgency:'normal' })
    }).then(r=>r.json());

    document.getElementById('liveOutput').innerHTML =
      `<div style="color:var(--green);margin-bottom:8px">✅ 质量: ${r.quality?.grade||'?'}级 ${r.quality?.score||0}分 | ${r.elapsed||'?'} | ${r.route?.model||'?'} | ${r.industry||'?'}</div>` +
      `<div style="line-height:1.8">${(r.content||'').replace(/\n/g,'<br>')}</div>`;
    document.getElementById('outputTime').textContent = r.elapsed || '';

    addLog(`✅ 演示完成: ${r.quality?.grade}级(${r.quality?.score}分) | ${r.industry} | ${r.elapsed}`, 'active');
    document.getElementById('plWritten').textContent = (parseInt(document.getElementById('plWritten').textContent)||0) + 1;
    document.getElementById('plReady').textContent = (parseInt(document.getElementById('plReady').textContent)||0) + 1;
  } catch(e) {
    addLog('❌ 演示失败: ' + e.message, 'err');
    document.getElementById('liveOutput').textContent = '错误: ' + e.message;
  }
}

// 启动时
addLog('🔴 文案作战中心 v10 自循环启动', 'active');
addLog('✅ 15模块·80+API·13模型·5平台', 'active');
addLog('⏰ 自动扫描每5分钟 | 自动写作已就绪', 'active');
addLog('📡 WebSocket通知已连接', 'active');

// 连接WebSocket
try {
  const ws = new WebSocket('ws://localhost:3457');
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.type === 'projects_update') addLog(`🔍 发现 ${d.data.count} 个新项目`, 'active');
    if (d.type === 'pipeline_complete') addLog(`✅ Pipeline完成: ${d.data.written||0}篇`, 'active');
  };
  ws.onopen = () => addLog('🔗 WebSocket已连接', 'active');
  ws.onclose = () => addLog('⚠️ WebSocket断开，15秒后重连', 'warn');
} catch {}

// 定时刷新
refresh();
setInterval(refresh, 5000);

// 首次演示
setTimeout(() => demoProject(), 2000);
</script>
</body>
</html>
