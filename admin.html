<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镜观管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#0a0e14;color:#e6e6e6}
.layout{display:flex;height:100vh}
.sidebar{width:220px;background:#111820;display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid #1e2a3a}
.sidebar-logo{padding:20px;font-size:20px;font-weight:700;color:#fff;border-bottom:1px solid #1e2a3a}
.sidebar-logo em{color:#b8860b;font-style:normal}
.sidebar-nav{flex:1;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;color:#8899aa;transition:.2s;font-size:14px;border-left:3px solid transparent}
.nav-item:hover{color:#fff;background:#1a2535}
.nav-item.active{color:#b8860b;border-left-color:#b8860b;background:#1a2535}
.nav-footer{padding:12px 20px;border-top:1px solid #1e2a3a;font-size:12px;color:#556}
.nav-footer a{color:#b8860b;text-decoration:none}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:56px;background:#111820;border-bottom:1px solid #1e2a3a;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.header h2{font-size:16px;font-weight:600}
.header-info{display:flex;align-items:center;gap:12px;font-size:12px;color:#8899aa}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.status-dot.online{background:#22c55e}
.status-dot.offline{background:#ef4444}
.content{flex:1;overflow-y:auto;padding:20px 24px}
/* Cards */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#151e2a;border-radius:8px;padding:16px;border:1px solid #1e2a3a}
.stat-card .label{font-size:12px;color:#8899aa;margin-bottom:4px}
.stat-card .value{font-size:28px;font-weight:700;color:#fff}
.stat-card .sub{font-size:11px;color:#556;margin-top:4px}
/* Tables */
.section{background:#151e2a;border-radius:8px;border:1px solid #1e2a3a;margin-bottom:20px;overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1e2a3a}
.section-header h3{font-size:14px;font-weight:600}
.section-body{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#1a2535;color:#8899aa;font-weight:500;white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid #1e2a3a;color:#ccc}
tr:hover td{background:#1a2535}
/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.badge-pending{background:#f59e0b20;color:#f59e0b;border:1px solid #f59e0b40}
.badge-contacted{background:#3b82f620;color:#60a5fa;border:1px solid #3b82f640}
.badge-completed{background:#22c55e20;color:#22c55e;border:1px solid #22c55e40}
.badge-cancelled{background:#ef444420;color:#ef4444;border:1px solid #ef444440}
.badge-A{background:#b8860b20;color:#b8860b;border:1px solid #b8860b40}
.badge-B{background:#60a5fa20;color:#60a5fa;border:1px solid #60a5fa40}
.badge-C{background:#8899aa20;color:#8899aa;border:1px solid #8899aa40}
/* Search/Filter */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #1e2a3a}
.toolbar input,.toolbar select{background:#0a0e14;border:1px solid #1e2a3a;color:#e6e6e6;padding:6px 10px;border-radius:4px;font-size:13px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:#b8860b}
.toolbar button{background:#b8860b;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px}
.toolbar button:hover{background:#a07608}
/* Pagination */
.pagination{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid #1e2a3a;font-size:13px}
.pagination button{background:#1e2a3a;color:#ccc;border:1px solid #2a3a4a;padding:4px 10px;border-radius:4px;cursor:pointer}
.pagination button:disabled{opacity:.4;cursor:default}
.pagination button:hover:not(:disabled){background:#2a3a4a}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:#00000080;z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#151e2a;border-radius:8px;border:1px solid #1e2a3a;max-width:700px;width:90%;max-height:80vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #1e2a3a}
.modal-header h3{font-size:16px}
.modal-close{background:none;border:none;color:#8899aa;cursor:pointer;font-size:20px}
.modal-body{padding:16px}
.modal-body .field{margin-bottom:12px}
.modal-body .field label{display:block;font-size:12px;color:#8899aa;margin-bottom:4px}
/* Panels */
.panel{display:none}
.panel.active{display:block}
/* Tabs */
.tab-bar{display:flex;gap:2px;padding:12px 16px;border-bottom:1px solid #1e2a3a}
.tab-btn{background:none;border:none;color:#8899aa;padding:6px 16px;cursor:pointer;font-size:13px;border-radius:4px}
.tab-btn.active{background:#b8860b20;color:#b8860b}
/* Loading */
.loading{text-align:center;padding:40px;color:#556;font-size:14px}
.loading::after{content:'';display:inline-block;width:20px;height:20px;border:2px solid #1e2a3a;border-top-color:#b8860b;border-radius:50%;animation:spin .8s linear infinite;margin-left:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-logo">镜观<em>管理</em></div>
    <div class="sidebar-nav">
      <div class="nav-item active" data-panel="dashboard">📊 总览</div>
      <div class="nav-item" data-panel="works">🎨 作品</div>
      <div class="nav-item" data-panel="orders">📋 订单</div>
      <div class="nav-item" data-panel="settings">⚙️ 设置</div>
    </div>
    <div class="nav-footer">
      <a href="portfolio.html" target="_blank">作品集 →</a><br>
      <a href="novel.html" target="_blank">小说 →</a><br>
      <a href="order.html" target="_blank">接单 →</a>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <h2 id="panel-title">📊 总览</h2>
      <div class="header-info">
        <span><span class="status-dot online" id="api-status-dot"></span><span id="api-status-text">连接中...</span></span>
        <span id="server-time"></span>
      </div>
    </div>

    <div class="content">
      <!-- Dashboard Panel -->
      <div class="panel active" id="panel-dashboard">
        <div class="stats-row" id="stats-cards">
          <div class="stat-card"><div class="label">作品总数</div><div class="value" id="stat-total">-</div></div>
          <div class="stat-card"><div class="label">推荐作品</div><div class="value" id="stat-top">-</div></div>
          <div class="stat-card"><div class="label">原创字数</div><div class="value" id="stat-words">-</div></div>
          <div class="stat-card"><div class="label">作品类型</div><div class="value" id="stat-types">-</div></div>
        </div>
        <div class="section">
          <div class="section-header"><h3>类型分布</h3></div>
          <div class="section-body" id="type-dist"></div>
        </div>
        <div class="section">
          <div class="section-header"><h3>最新作品</h3></div>
          <div class="section-body"><div id="recent-works" class="loading">加载中</div></div>
        </div>
      </div>

      <!-- Works Panel -->
      <div class="panel" id="panel-works">
        <div class="section">
          <div class="toolbar">
            <input type="text" id="works-search" placeholder="搜索标题..." oninput="worksPage=1;loadWorks()">
            <select id="works-grade" onchange="worksPage=1;loadWorks()">
              <option value="">全部级别</option>
              <option value="A">A 级</option>
              <option value="B">B 级</option>
              <option value="C">C 级</option>
            </select>
            <select id="works-type" onchange="worksPage=1;loadWorks()">
              <option value="">全部类型</option>
            </select>
            <span style="color:#556;font-size:12px;margin-left:auto" id="works-count"></span>
          </div>
          <div class="section-body"><div id="works-data" class="loading">加载中</div></div>
          <div class="pagination" id="works-pagination"></div>
        </div>
      </div>

      <!-- Orders Panel -->
      <div class="panel" id="panel-orders">
        <div class="section">
          <div class="toolbar">
            <select id="order-status" onchange="orderPage=1;loadOrders()">
              <option value="">全部状态</option>
              <option value="pending">待处理</option>
              <option value="contacted">已联系</option>
              <option value="completed">已完成</option>
              <option value="cancelled">已取消</option>
            </select>
            <span style="color:#556;font-size:12px;margin-left:auto" id="orders-count"></span>
          </div>
          <div class="section-body"><div id="orders-data" class="loading">加载中</div></div>
          <div class="pagination" id="orders-pagination"></div>
        </div>
      </div>

      <!-- Settings Panel -->
      <div class="panel" id="panel-settings">
        <div class="section">
          <div class="section-header"><h3>系统状态</h3></div>
          <div class="section-body" style="padding:16px" id="sys-health"></div>
        </div>
        <div class="section">
          <div class="section-header"><h3>数据操作</h3></div>
          <div class="section-body" style="padding:16px">
            <button onclick="reSeed()" style="background:#b8860b;color:#fff;border:none;padding:8px 20px;border-radius:4px;cursor:pointer">重新导入数据</button>
            <span id="seed-msg" style="margin-left:12px;font-size:13px;color:#8899aa"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header"><h3 id="modal-title">详情</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// ── 状态 ──
let PORTFOLIO_DATA = [];
let allWorks = [];
let worksPage = 1, orderPage = 1;
const PAGE_SIZE = 30;

// ── 面板切换 ──
document.querySelectorAll('.nav-item').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('panel-' + el.dataset.panel).classList.add('active');
    document.getElementById('panel-title').textContent = el.textContent.trim();
  };
});

// ── API 调用 ──
async function api(path, opts = {}) {
  try {
    const r = await fetch(path, { ...opts, signal: AbortSignal.timeout(3000) });
    return await r.json();
  } catch { return null; }
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }
function showModal(title, html) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

// ── 仪表盘 ──
async function loadDashboard() {
  const stats = await api('/api/stats');
  if (stats) {
    document.getElementById('stat-total').textContent = stats.total || 0;
    document.getElementById('stat-top').textContent = stats.top || 0;
    document.getElementById('stat-words').textContent = (stats.totalWords || 0).toLocaleString();
    document.getElementById('stat-types').textContent = Object.keys(stats.types || {}).length;
  }
  const types = await api('/api/types');
  if (types && types.length) {
    const max = Math.max(...types.map(t => t.count || 0));
    document.getElementById('type-dist').innerHTML = '<table><tr><th>类型</th><th>数量</th><th></th></tr>' +
      types.map(t => `<tr><td>${t.type}</td><td>${t.count}</td><td><div style="height:6px;background:#1e2a3a;border-radius:3px;width:200px"><div style="height:6px;background:#b8860b;border-radius:3px;width:${(t.count/max*100).toFixed(0)}%"></div></div></td></tr>`).join('') +
      '</table>';
  }
  const w = await api('/api/works?limit=10&sort=score');
  if (w && w.works) {
    document.getElementById('recent-works').innerHTML = '<table><tr><th>标题</th><th>类型</th><th>评分</th><th>级别</th></tr>' +
      w.works.map(work => `<tr onclick="showWork(${work.id})" style="cursor:pointer"><td>${esc(work.title)}</td><td>${work.type||''}</td><td>${work.score||''}</td><td><span class="badge badge-${work.grade||'C'}">${work.grade||'C'}</span></td></tr>`).join('') +
      '</table>';
  }
}

// ── 作品管理 ──
async function loadWorks() {
  const el = document.getElementById('works-data');
  el.className = 'loading';
  el.textContent = '加载中';

  const grade = document.getElementById('works-grade').value;
  const search = document.getElementById('works-search').value;
  const type = document.getElementById('works-type').value;
  let params = `page=${worksPage}&limit=${PAGE_SIZE}`;
  if (grade) params += `&grade=${grade}`;
  if (search) params += `&search=${encodeURIComponent(search)}`;
  if (type) params += `&type=${encodeURIComponent(type)}`;

  const res = await api('/api/works?' + params);
  if (res && res.works) {
    allWorks = res.works;
    document.getElementById('works-count').textContent = `共 ${res.pagination.total} 条`;
    renderWorksTable(res.works);
    renderPagination('works-pagination', res.pagination, () => loadWorks());
  } else if (PORTFOLIO_DATA.length) {
    let filtered = PORTFOLIO_DATA;
    if (grade) filtered = filtered.filter(w => w.grade === grade);
    if (search) filtered = filtered.filter(w => (w.title||'').includes(search));
    if (type) filtered = filtered.filter(w => w.type === type);
    const total = filtered.length;
    const start = (worksPage - 1) * PAGE_SIZE;
    filtered = filtered.slice(start, start + PAGE_SIZE);
    allWorks = filtered;
    document.getElementById('works-count').textContent = `共 ${total} 条 (离线)`;
    renderWorksTable(filtered);
    renderPagination('works-pagination', { page: worksPage, limit: PAGE_SIZE, total, totalPages: Math.ceil(total/PAGE_SIZE) }, () => loadWorks());
  } else {
    el.innerHTML = '<div style="padding:20px;text-align:center;color:#ef4444">⚠ 无法加载数据</div>';
  }
}

function renderWorksTable(works) {
  document.getElementById('works-data').innerHTML = '<table><tr><th>标题</th><th>类型</th><th>评分</th><th>级别</th><th>字数</th></tr>' +
    works.map(w => `<tr onclick="showWork(${w.id})" style="cursor:pointer"><td>${esc(w.title||'')}</td><td>${w.type||''}</td><td>${w.score||''}</td><td><span class="badge badge-${w.grade||'C'}">${w.grade||'C'}</span></td><td>${(w.word_count||0).toLocaleString()}</td></tr>`).join('') +
    '</table>';
}

async function showWork(id) {
  const work = await api(`/api/works/${id}`);
  if (!work) {
    const w = PORTFOLIO_DATA.find(p => p.id === id);
    if (!w) return alert('作品详情不可用');
    showModal(esc(w.title), `<div class="field"><label>类型</label>${w.type||'-'}</div><div class="field"><label>评分</label>${w.score||'-'}</div><div class="field"><label>字数</label>${(w.word_count||0).toLocaleString()}</div><div class="field"><label>内容</label><pre style="background:#0a0e14;padding:12px;border-radius:4px;white-space:pre-wrap;max-height:300px;overflow:auto;font-size:12px">${esc(w.content||'')}</pre></div>`);
    return;
  }
  showModal(esc(work.title), `
    <div class="field"><label>类型</label>${work.type||'-'}</div>
    <div class="field"><label>风格</label>${work.style||'-'}</div>
    <div class="field"><label>评分</label>${work.score||'-'} / <span class="badge badge-${work.grade||'C'}">${work.grade||'C'}</span></div>
    <div class="field"><label>字数</label>${(work.word_count||0).toLocaleString()}</div>
    <div class="field"><label>内容</label><pre style="background:#0a0e14;padding:12px;border-radius:4px;white-space:pre-wrap;max-height:300px;overflow:auto;font-size:12px">${esc(work.content||'')}</pre></div>
    ${work.suggestions ? `<div class="field"><label>建议</label>${esc(work.suggestions)}</div>` : ''}
  `);
}

// ── 订单管理 ──
async function loadOrders() {
  const el = document.getElementById('orders-data');
  el.className = 'loading';
  el.textContent = '加载中';

  const status = document.getElementById('order-status').value;
  let params = `page=${orderPage}&limit=20`;
  if (status) params += `&status=${status}`;

  const res = await api('/api/orders?' + params);
  if (res && res.orders) {
    document.getElementById('orders-count').textContent = `共 ${res.pagination.total} 条`;
    document.getElementById('orders-data').innerHTML = '<table><tr><th>#</th><th>客户</th><th>联系方式</th><th>类型</th><th>预算</th><th>状态</th><th>时间</th><th>操作</th></tr>' +
      res.orders.map(o => `<tr>
        <td>${o.id}</td>
        <td>${esc(o.client_name||'')}</td>
        <td style="font-size:12px">${esc(o.client_contact||'')}</td>
        <td>${o.project_type||''}</td>
        <td>${o.budget||''}</td>
        <td><span class="badge badge-${o.status||'pending'}">${statusLabels[o.status]||o.status}</span></td>
        <td style="font-size:12px;color:#556">${o.created_at ? o.created_at.slice(0,10) : ''}</td>
        <td><button onclick="showOrder(${o.id})" style="background:#1e2a3a;border:1px solid #2a3a4a;color:#ccc;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:12px">详情</button></td>
      </tr>`).join('') + '</table>';
    renderPagination('orders-pagination', res.pagination, () => loadOrders());
  } else {
    el.innerHTML = '<div style="padding:20px;text-align:center;color:#556">暂无订单数据</div>';
  }
}

const statusLabels = { pending: '待处理', contacted: '已联系', completed: '已完成', cancelled: '已取消' };

async function showOrder(id) {
  const res = await api(`/api/orders/${id}`);
  if (!res) return alert('无法获取订单详情');
  const o = res;
  const statusOpts = Object.entries(statusLabels).map(([k,v]) => `<option value="${k}" ${k===o.status?'selected':''}>${v}</option>`).join('');
  showModal(`订单 #${o.id}`, `
    <div class="field"><label>客户姓名</label>${esc(o.client_name||'')}</div>
    <div class="field"><label>联系方式</label>${esc(o.client_contact||'')}</div>
    <div class="field"><label>项目类型</label>${o.project_type||'-'}</div>
    <div class="field"><label>预算</label>${o.budget||'-'}</div>
    <div class="field"><label>截止时间</label>${o.deadline||'-'}</div>
    <div class="field"><label>描述</label><pre style="background:#0a0e14;padding:8px;border-radius:4px;font-size:12px;white-space:pre-wrap">${esc(o.description||'-')}</pre></div>
    <div class="field"><label>备注</label><textarea id="order-notes" style="width:100%;background:#0a0e14;border:1px solid #1e2a3a;color:#e6e6e6;padding:8px;border-radius:4px;min-height:60px">${esc(o.notes||'')}</textarea></div>
    <div class="field"><label>状态</label><select id="order-status-select" style="background:#0a0e14;border:1px solid #1e2a3a;color:#e6e6e6;padding:4px 8px;border-radius:4px">${statusOpts}</select>
    <button onclick="updateOrder(${o.id})" style="background:#b8860b;color:#fff;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;margin-top:8px">保存修改</button>
    <span id="order-upd-msg" style="margin-left:8px;font-size:12px;color:#8899aa"></span></div>
  `);
}

async function updateOrder(id) {
  const status = document.getElementById('order-status-select').value;
  const notes = document.getElementById('order-notes').value;
  const msg = document.getElementById('order-upd-msg');
  msg.textContent = '保存中...';
  const res = await api(`/api/orders/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status, notes })
  });
  if (res) { msg.textContent = '✅ 已保存'; loadOrders(); }
  else { msg.textContent = '❌ 保存失败'; }
}

// ── 系统设置 ──
async function loadSettings() {
  const h = await api('/api/admin/health');
  if (h) {
    document.getElementById('sys-health').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><strong>数据库</strong>: ${h.db || 'SQLite'}</div>
        <div><strong>作品数</strong>: ${h.works || 0}</div>
        <div><strong>订单数</strong>: ${h.orders || 0}</div>
        <div><strong>小说章节</strong>: ${h.novels || 0}</div>
        <div><strong>运行时间</strong>: ${Math.floor((h.uptime||0)/60)} 分钟</div>
        <div><strong>内存</strong>: ${h.memory ? Math.round(h.memory/1024/1024) + 'MB' : '-'}</div>
        <div><strong>版本</strong>: 2.0.0</div>
      </div>`;
  } else {
    document.getElementById('sys-health').innerHTML = '<div style="color:#556">数据库未连接（离线模式）</div>';
  }
}

async function reSeed() {
  const msg = document.getElementById('seed-msg');
  msg.textContent = '导入中...';
  const res = await api('/api/admin/seed', { method: 'POST' });
  if (res && res.success) {
    msg.textContent = `✅ 已导入 ${res.works||0} 条作品, ${res.chapters||0} 章小说`;
    loadDashboard(); loadWorks();
  } else { msg.textContent = '❌ 导入失败'; }
}

// ── Pagination ──
function renderPagination(elId, p, cb) {
  const el = document.getElementById(elId);
  if (!p || p.totalPages <= 1) { el.innerHTML = ''; return; }
  let html = `<button ${p.page<=1?'disabled':''} onclick="(function(){${elId.replace('-pagination','')}Page=1;cb()})()">首页</button>`;
  html += `<button ${p.page<=1?'disabled':''} onclick="(function(){${elId.replace('-pagination','')}Page=Math.max(1,${p.page}-1);cb()})()">‹</button>`;
  html += `<span style="color:#556">${p.page}/${p.totalPages}</span>`;
  html += `<button ${p.page>=p.totalPages?'disabled':''} onclick="(function(){${elId.replace('-pagination','')}Page=Math.min(${p.totalPages},${p.page}+1);cb()})()">›</button>`;
  el.innerHTML = html;
}

// ── 工具 ──
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── 初始化 ──
async function init() {
  // 切换 works-type 下拉
  const types = await api('/api/types');
  if (types) {
    const sel = document.getElementById('works-type');
    types.forEach(t => { const o = document.createElement('option'); o.value=t.type; o.textContent=`${t.type} (${t.count})`; sel.appendChild(o); });
  }

  // Load all panels
  await Promise.all([loadDashboard(), loadWorks(), loadOrders(), loadSettings()]);

  // Update server time
  function updateTime() { document.getElementById('server-time').textContent = new Date().toLocaleString('zh-CN'); }
  setInterval(updateTime, 1000); updateTime();

  // Auto-refresh dashboard every 60s
  setInterval(() => { loadDashboard(); loadOrders(); loadSettings(); }, 60000);
}

init();

// Catch-all for pagination callbacks
window.worksPage = worksPage;
window.orderPage = orderPage;
</script>
