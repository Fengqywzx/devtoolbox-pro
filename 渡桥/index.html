<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>渡桥 — 残疾人劳动者权益</title><link rel="stylesheet" href="css/app.css"><meta name="theme-color" content="#7c3aed"></head><body><div id="app"><header class="app-header"><h1>🌉 渡桥</h1><span class="header-sub">桥不是为了走过去</span></header><section class="card ability-card"><div class="card-header"><span class="card-icon">💪</span><h2>能力档案</h2></div><p class="card-hint">不是残疾档案，是你能力的清单</p><div id="abilityProfile"></div><button class="btn-primary btn-large" id="btnEditAbility">✏ 编辑能力档案</button></section><section class="card job-card"><div class="card-header"><span class="card-icon">🔍</span><h2>无障碍工作匹配</h2></div><button class="btn-primary btn-large" id="btnSearchJobs">🔍 搜索适合的工作</button><div id="jobResults"></div></section><section class="card access-card"><div class="card-header"><span class="card-icon">🗺</span><h2>无障碍设施地图</h2></div><div class="form-group"><label>城市</label><input type="text" id="accessCity" value="深圳" placeholder="输入城市名"></div><div id="accessMap"></div></section><section class="card rights-card"><div class="card-header"><span class="card-icon">📖</span><h2>残疾人权益保护</h2></div><div id="disabilityRights"></div></section><footer class="app-footer"><p>🌉 渡桥 · 有能力，无障碍</p></footer></div><div class="modal-overlay hidden" id="abilityModal"><div class="modal-card"><h2>✏ 能力档案</h2><div class="form-group"><label>你擅长什么工作？（多选）</label><textarea id="abilitySkills" rows="3" placeholder="如：电脑操作、手工制作、客服沟通、写作翻译…"></textarea></div><div class="form-group"><label>工作偏好</label><select id="abilityPreference"><option value="remote">远程/居家工作</option><option value="office">办公室工作</option><option value="hybrid">混合</option></select></div><div class="form-group"><label>无障碍需求</label><input type="text" id="abilityNeeds" placeholder="如：轮椅通道、屏幕阅读器、手语翻译…"></div><div class="btn-row"><button class="btn-secondary" id="btnAbilityCancel">取消</button><button class="btn-primary" id="btnAbilitySave">保存</button></div></div></div><script src="js/app.js"></script></body></html>
