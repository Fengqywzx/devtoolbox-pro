<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>谷雨 — 农业工人守护</title><link rel="stylesheet" href="css/app.css"><meta name="theme-color" content="#65a30d"></head><body><div id="app"><header class="app-header"><h1>🌾 谷雨</h1><span class="header-sub">你的劳动应被按时收获</span></header><section class="card work-card"><div class="card-header"><span class="card-icon">🔍</span><h2>找农活</h2></div><div class="form-group"><label>你的位置</label><input type="text" id="location" placeholder="如：河北保定"></div><div class="form-group"><label>作物/农活类型</label><select id="cropType"><option value="all">不限</option><option value="wheat">小麦收割</option><option value="rice">水稻插秧/收割</option><option value="corn">玉米收割</option><option value="cotton">棉花采摘</option><option value="fruit">水果采摘</option><option value="veg">蔬菜采收</option><option value="other">其他</option></select></div><button class="btn-primary btn-large" id="btnSearchWork">🔍 查找附近农活</button><div id="workResults"></div></section><section class="card wage-card"><div class="card-header"><span class="card-icon">💰</span><h2>工资记录</h2><span class="badge" id="wageBadge">本月¥0</span></div><button class="btn-primary btn-large" id="btnAddWage">+ 记录一笔工资</button><div id="wageLog"></div></section><section class="card chemical-card"><div class="card-header"><span class="card-icon">🧪</span><h2>农药暴露日记</h2></div><p class="card-hint">记录每天接触的农药——这是职业病认定的关键证据</p><button class="btn-primary btn-large" id="btnAddPesticide">+ 记录农药接触</button><div id="pesticideLog"></div><div id="healthWarnings"></div></section><section class="card health-card"><div class="card-header"><span class="card-icon">🏥</span><h2>健康提醒</h2></div><div id="healthTips"></div></section><footer class="app-footer"><p>🌾 谷雨 · 谷雨前后，种瓜点豆</p></footer></div><div class="modal-overlay hidden" id="wageModal"><div class="modal-card"><h2>💰 记录工资</h2><div class="form-group"><label>雇主/农场</label><input type="text" id="wageEmployer" placeholder="如：老王农场"></div><div class="form-group"><label>金额（元）</label><input type="number" id="wageAmount" step="1" value="0"></div><div class="form-group"><label>工作天数</label><input type="number" id="wageDays" step="0.5" value="1"></div><div class="btn-row"><button class="btn-secondary" id="btnWageCancel">取消</button><button class="btn-primary" id="btnWageSave">保存</button></div></div></div><div class="modal-overlay hidden" id="pestModal"><div class="modal-card"><h2>🧪 记录农药接触</h2><div class="form-group"><label>农药名称</label><input type="text" id="pestName" placeholder="如：百草枯、草甘膦…"></div><div class="form-group"><label>接触时长（小时）</label><input type="number" id="pestHours" step="0.5" value="2"></div><div class="form-group"><label>防护措施</label><select id="pestProtection"><option value="none">无防护</option><option value="mask">戴口罩</option><option value="full">全套防护</option></select></div><div class="btn-row"><button class="btn-secondary" id="btnPestCancel">取消</button><button class="btn-primary" id="btnPestSave">保存</button></div></div></div><script src="js/app.js"></script></body></html>
