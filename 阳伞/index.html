<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>遮阳伞 — 流动商贩守护</title><link rel="stylesheet" href="css/app.css"><meta name="theme-color" content="#0d9488"></head><body><div id="app"><header class="app-header"><h1>☂ 遮阳伞</h1><span class="header-sub">一把伞撑起一个家</span><button class="btn-stealth" id="btnStealth">🔀</button></header><section class="card conflict-card"><div class="card-header"><span class="card-icon">📹</span><h2>冲突记录</h2></div><p class="card-hint">一键录音录像——保护自己的合法权益</p><button class="btn-primary btn-large btn-red" id="btnRecordConflict">🔴 开始记录</button><div id="conflictLog"></div></section><section class="card knowledge-card"><div class="card-header"><span class="card-icon">📖</span><h2>合法经营知识</h2></div><div id="rightsKnowledge"></div></section><section class="card biz-card"><div class="card-header"><span class="card-icon">📊</span><h2>摊位收支</h2></div><div class="biz-summary"><div class="biz-stat"><span class="biz-value" id="todayRevenue">¥0</span><span>今日收入</span></div><div class="biz-stat"><span class="biz-value" id="monthRevenue">¥0</span><span>本月收入</span></div></div><button class="btn-primary btn-large" id="btnAddBiz">+ 记录一笔</button><div id="bizLog"></div></section><footer class="app-footer"><p>☂ 遮阳伞 · 伞下是一家人的生计</p></footer></div><div class="modal-overlay hidden" id="bizModal"><div class="modal-card"><h2>📊 记录收支</h2><div class="form-group"><label>类型</label><select id="bizType"><option value="income">💰 收入</option><option value="expense">💸 支出（进货/罚款等）</option></select></div><div class="form-group"><label>金额（元）</label><input type="number" id="bizAmount" step="1" value="0"></div><div class="form-group"><label>备注</label><input type="text" id="bizNote" placeholder="如：卖水果收入"></div><div class="btn-row"><button class="btn-secondary" id="btnBizCancel">取消</button><button class="btn-primary" id="btnBizSave">保存</button></div></div></div><script src="js/app.js"></script></body></html>
