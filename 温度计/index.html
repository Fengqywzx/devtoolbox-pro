<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>温度计 — 养老护理员守护</title><link rel="stylesheet" href="css/app.css"><meta name="theme-color" content="#db2777"></head><body><div id="app"><header class="app-header"><h1>🌡 温度计</h1><span class="header-sub">谁来量你的心</span></header><section class="card mood-card"><div class="card-header"><span class="card-icon">💙</span><h2>今日情绪自评</h2></div><div class="mood-slider"><input type="range" id="moodSlider" min="1" max="10" value="5"><div class="mood-labels"><span>😞 耗竭</span><span>😐 一般</span><span>😊 充实</span></div></div><div class="mood-display" id="moodDisplay">你今天感觉：一般</div><button class="btn-primary btn-large" id="btnSaveMood">保存今日心情</button><div class="mood-history" id="moodHistory"></div></section><section class="card gratitude-card"><div class="card-header"><span class="card-icon">🌟</span><h2>被需要的时刻</h2></div><p class="card-hint">记录那些让你觉得"这份工作有意义"的瞬间</p><button class="btn-primary btn-large" id="btnAddGratitude">+ 记录一个瞬间</button><div id="gratitudeLog"></div></section><section class="card rest-card"><div class="card-header"><span class="card-icon">⏰</span><h2>休息提醒</h2></div><div class="rest-timer" id="restTimer"><div class="rest-circle" id="restCircle">--:--</div><p id="restMsg">今天还没有开始记录</p></div><button class="btn-primary btn-large" id="btnToggleRest">▶ 开始记录工时</button></section><section class="card rights-card"><div class="card-header"><span class="card-icon">📖</span><h2>护理员权益速查</h2></div><div class="rights-list" id="rightsList"></div></section><footer class="app-footer"><p>🌡 温度计 · 你量别人的体温，也要量自己的心</p></footer></div><div class="modal-overlay hidden" id="gratitudeModal"><div class="modal-card"><h2>🌟 记录被需要的时刻</h2><div class="form-group"><label>发生了什么？</label><textarea id="gratitudeText" rows="3" placeholder="如：张奶奶今天笑了，拉着我的手说了谢谢…"></textarea></div><div class="btn-row"><button class="btn-secondary" id="btnGratCancel">取消</button><button class="btn-primary" id="btnGratSave">保存</button></div></div></div><script src="js/app.js"></script></body></html>
